<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plumber Bros - 2 Player</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111111">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{background:#6ec6ff;width:100%;max-width:800px;height:auto;border-radius:6px;touch-action:none}
  p{margin:8px 10px;font-size:13px;opacity:.85;text-align:center}
  .pad{display:flex;justify-content:space-between;width:100%;max-width:800px;padding:6px 8px}
  .grp{display:flex;align-items:center;gap:10px}
  .stick{position:relative;width:min(130px,28vw);height:min(130px,28vw);border-radius:50%;border:3px solid rgba(255,255,255,.65);background:rgba(255,255,255,.14);touch-action:none}
  .knob{position:absolute;left:27%;top:27%;width:46%;height:46%;border-radius:30%;border:2px solid #fff}
  .p1 .knob,.p1 .fire{background:#1e88e5}.p2 .knob,.p2 .fire{background:#e53935}
  .fire{width:min(64px,14vw);height:min(64px,14vw);border-radius:50%;border:3px solid #fff;color:#fff;font-size:18px;padding:0;touch-action:none}
  .fire:active{filter:brightness(1.4)}
  .rot{display:none;margin:8px;padding:8px 12px;background:#ffc107;color:#000;border-radius:6px;font-size:14px;font-weight:bold;text-align:center}
  @media (orientation:portrait){.rot{display:block}}
  @media (orientation:landscape){
    :root{padding:0}
    body{height:100vh;height:100dvh;overflow:hidden}
    canvas{width:min(100vw,200vh);width:min(100vw,200dvh);max-width:none;border-radius:0}
    p{display:none}
    .pad{position:fixed;left:0;right:0;bottom:0;max-width:none;padding:0 max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
    .grp{pointer-events:auto;gap:12px}
    .stick{width:120px;height:120px;opacity:.75}
    .fire{opacity:.75;width:60px;height:60px}
  }
</style>
</head>
<body>
<div class="rot">Turn your phone sideways for a bigger screen</div>
<canvas id="c" width="800" height="400"></canvas>
<div class="pad">
  <div class="grp p1"><div class="stick" data-keys="KeyA,KeyD,KeyW"><div class="knob"></div></div><button class="fire" data-f="0">●</button></div>
  <div class="grp p2"><button class="fire" data-f="1">●</button><div class="stick" data-keys="ArrowLeft,ArrowRight,ArrowUp"><div class="knob"></div></div></div>
</div>
<p>P1 blue: A / D move, W jump, F shoot | P2 red: ← / → move, ↑ jump, Enter shoot | R restart</p>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 3200, H = 400, G = 0.6, FLAG = 3100;
const MAXAMMO = 5, RELOAD_MS = 20000;
const BLUE = '#1e88e5', RED = '#e53935';

const solids = [
  [0,360,700,40],[800,360,600,40],[1500,360,500,40],[2100,360,1100,40],
  [300,280,120,20],[560,220,100,20],[1000,270,120,20],[1200,200,100,20],
  [1650,270,150,20],[1900,210,100,20],[2400,270,120,20],[2650,210,120,20]
].map(([x,y,w,h]) => ({x,y,w,h}));

// enemy patrols: [left, right, y, speed]
const PATROLS = [
  [250,680,330,1.1],[400,690,330,1.6],
  [820,1100,330,1.3],[950,1390,330,1.7],[1150,1390,330,1.2],
  [1520,1800,330,1.5],[1700,1990,330,1.1],
  [2120,2400,330,1.4],[2300,2600,330,1.8],[2500,2800,330,1.2],[2700,3050,330,1.6],[2900,3090,330,1.3],
  [300,420,252,1.0],[1650,1800,242,1.2],[2650,2770,182,1.0],[1900,2000,182,1.1]
];

let players, coins, enemies, bullets, lives, state, cam;
const keys = {};

function mk(color, x, l, r, j) {
  return {x, y:300, w:24, h:32, vx:0, vy:0, dx:0, ground:false, on:null, color, l, r, j,
    score:0, inv:0, dir:1, ammo:MAXAMMO, reloadAt:0};
}

function init() {
  players = [
    mk(BLUE, 100, 'KeyA', 'KeyD', 'KeyW'),
    mk(RED, 140, 'ArrowLeft', 'ArrowRight', 'ArrowUp')
  ];
  coins = [[320,250],[360,250],[400,250],[580,190],[620,190],[1020,240],[1060,240],
    [1220,170],[1670,240],[1720,240],[1920,180],[2420,240],[2670,180],[2710,180],
    [900,320],[1300,320],[2200,320],[2500,320],[2900,320]].map(([x,y]) => ({x,y,got:false}));
  enemies = PATROLS.map(([a,b,y,s],i) => ({x:a+(b-a)/2, y, w:28, h:28, vx:i%2?s:-s, a, b, dead:false}));
  bullets = [];
  lives = 5; state = 'play'; cam = 0;
}

const hit = (a, b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

function shoot(p) {
  if (state !== 'play' || p.ammo <= 0) return;
  p.ammo--;
  if (!p.reloadAt) p.reloadAt = performance.now() + RELOAD_MS; // timer starts on first shot
  bullets.push({x: p.dir > 0 ? p.x + p.w : p.x - 10, y: p.y + 15, w:10, h:4, vx: p.dir * 9, owner: p});
}

function hurt(p) {
  lives--;
  if (lives <= 0) { state = 'over'; return; }
  const o = players.find(q => q !== p);
  p.x = o.x; p.y = Math.max(0, o.y - 50); p.vy = 0; p.inv = 120;
}

function update() {
  if (state !== 'play') return;
  const now = performance.now();

  players.forEach(p => {
    if (p.reloadAt && now >= p.reloadAt) { p.ammo = MAXAMMO; p.reloadAt = 0; }
    p.on = null;
    p.vx = 0;
    if (keys[p.l]) { p.vx = -4; p.dir = -1; }
    if (keys[p.r]) { p.vx = 4;  p.dir = 1; }
    if (keys[p.j] && p.ground) { p.vy = -12.5; p.ground = false; }
    p.vy = Math.min(p.vy + G, 15);

    const x0 = p.x;
    p.x += p.vx;
    p.x = Math.max(cam, Math.min(p.x, cam + 800 - p.w));
    solids.forEach(s => {
      if (p.vx !== 0 && hit(p, s)) p.x = p.vx > 0 ? s.x - p.w : s.x + s.w;
    });
    p.dx = p.x - x0;

    const py = p.y;
    p.y += p.vy; p.ground = false;
    solids.forEach(s => {
      if (hit(p, s)) {
        if (p.vy > 0) { p.y = s.y - p.h; p.ground = true; } else p.y = s.y + s.h;
        p.vy = 0;
      }
    });
    // stand on the other player's head (and bump head from below)
    const o = players[0] === p ? players[1] : players[0];
    if (hit(p, o)) {
      if (p.vy >= 0 && py + p.h <= o.y + 10) { p.y = o.y - p.h; p.vy = 0; p.ground = true; p.on = o; }
      else if (p.vy < 0 && py >= o.y + o.h - 10) { p.y = o.y + o.h; p.vy = 0; }
    }
  });

  // rider moves along with the player underneath
  players.forEach(p => {
    if (!p.on || p.on.dx === 0) return;
    p.x += p.on.dx;
    p.x = Math.max(cam, Math.min(p.x, cam + 800 - p.w));
    solids.forEach(s => {
      if (hit(p, s)) p.x = p.on.dx > 0 ? s.x - p.w : s.x + s.w;
    });
  });

  players.forEach(p => {
    if (p.inv > 0) p.inv--;
    coins.forEach(c => {
      if (!c.got && Math.abs(p.x+12-c.x) < 18 && Math.abs(p.y+16-c.y) < 22) { c.got = true; p.score += 10; }
    });
    enemies.forEach(e => {
      if (e.dead || !hit(p, e)) return;
      if (p.vy > 0 && p.y + p.h - e.y < 18) { e.dead = true; p.vy = -8; p.score += 100; }
      else if (p.inv === 0) hurt(p);
    });
    if (p.y > H + 80) hurt(p);
    if (p.x + p.w >= FLAG) state = 'win';
  });

  enemies.forEach(e => {
    if (e.dead) return;
    e.x += e.vx;
    if (e.x < e.a || e.x + e.w > e.b) e.vx *= -1;
  });

  // bullets only hit walls and enemies, never players
  bullets = bullets.filter(b => {
    b.x += b.vx;
    if (b.x < cam - 40 || b.x > cam + 840) return false;
    if (solids.some(s => hit(b, s))) return false;
    const e = enemies.find(e => !e.dead && hit(b, e));
    if (e) { e.dead = true; b.owner.score += 50; return false; }
    return true;
  });

  const mid = (players[0].x + players[1].x) / 2;
  cam = Math.max(cam, Math.min(Math.max(0, mid - 400), W - 800));
}

function drawAmmo(p, x, right, now) {
  for (let i = 0; i < MAXAMMO; i++) {
    const lx = x + i * 9;
    ctx.fillStyle = p.color;
    if (i < p.ammo) ctx.fillRect(lx, 30, 4, 16);
    else { ctx.globalAlpha = .3; ctx.fillRect(lx, 30, 4, 16); ctx.globalAlpha = 1; }
  }
  if (p.reloadAt) {
    ctx.font = '12px Arial'; ctx.fillStyle = '#000';
    ctx.textAlign = right ? 'right' : 'left';
    ctx.fillText(Math.ceil((p.reloadAt - now) / 1000) + 's', right ? x - 6 : x + MAXAMMO * 9 + 4, 43);
  }
}

function draw() {
  const now = performance.now();
  ctx.clearRect(0, 0, 800, 400);
  ctx.save(); ctx.translate(-cam, 0);

  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 14; i++) {
    ctx.beginPath(); ctx.ellipse(i*260+80, 60+(i%3)*30, 45, 18, 0, 0, 7); ctx.fill();
  }
  solids.forEach(s => {
    ctx.fillStyle = '#8d5a2b'; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = '#4caf50'; ctx.fillRect(s.x, s.y, s.w, 6);
  });
  ctx.fillStyle = '#ffc107';
  coins.forEach(c => { if (!c.got) { ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, 7); ctx.fill(); } });
  enemies.forEach(e => {
    if (e.dead) return;
    ctx.fillStyle = '#6d4c41'; ctx.fillRect(e.x, e.y, e.w, e.h);
    ctx.fillStyle = '#fff'; ctx.fillRect(e.x+5, e.y+6, 6, 6); ctx.fillRect(e.x+17, e.y+6, 6, 6);
    ctx.fillStyle = '#000'; ctx.fillRect(e.x+7, e.y+8, 2, 3); ctx.fillRect(e.x+19, e.y+8, 2, 3);
  });
  ctx.fillStyle = '#fff'; ctx.fillRect(FLAG, 120, 6, 240);
  ctx.fillStyle = '#ffc107';
  ctx.beginPath(); ctx.moveTo(FLAG+6, 124); ctx.lineTo(FLAG+50, 148); ctx.lineTo(FLAG+6, 172); ctx.fill();

  bullets.forEach(b => {
    ctx.fillStyle = b.owner.color; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(b.x, b.y, b.w, b.h);
  });

  players.forEach(p => {
    if (p.inv > 0 && Math.floor(p.inv / 6) % 2) return;
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#ffcc99'; ctx.fillRect(p.x+4, p.y+8, p.w-8, 10);
    ctx.fillStyle = p.color; ctx.fillRect(p.x-2, p.y, p.w+4, 7);
    ctx.fillStyle = '#000'; ctx.fillRect(p.x + (p.dir > 0 ? 15 : 6), p.y+10, 3, 3);
    ctx.fillStyle = '#333'; ctx.fillRect(p.dir > 0 ? p.x + p.w - 2 : p.x - 10, p.y + 16, 12, 5); // gun
  });
  ctx.restore();

  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'left';  ctx.fillStyle = BLUE; ctx.fillText('P1: ' + players[0].score, 12, 22);
  ctx.textAlign = 'right'; ctx.fillStyle = RED;  ctx.fillText('P2: ' + players[1].score, 788, 22);
  ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText('Lives: ' + lives, 400, 22);
  drawAmmo(players[0], 12, false, now);
  drawAmmo(players[1], 788 - (MAXAMMO * 9 - 5), true, now);

  if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, 800, 400);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '36px Arial';
    ctx.fillText(state === 'win' ? 'Level complete!' : 'Game over', 400, 170);
    ctx.font = '20px Arial';
    ctx.fillText('P1: ' + players[0].score + '   P2: ' + players[1].score, 400, 210);
    ctx.fillText('Press R or tap to play again', 400, 245);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

const FIRE = { KeyF: 0, Enter: 1 };
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Enter') e.preventDefault();
  if (e.code === 'KeyR') init();
  if (!e.repeat && FIRE[e.code] !== undefined) shoot(players[FIRE[e.code]]);
});
addEventListener('keyup', e => keys[e.code] = false);

// Touch buttons (multi-touch so both players can play at once)
// Circular joystick: left/right = move, up = jump
document.querySelectorAll('.stick').forEach(st => {
  const knob = st.querySelector('.knob');
  const [L, R, U] = st.dataset.keys.split(',');
  const set = (l, r, u) => { keys[L] = l; keys[R] = r; keys[U] = u; };
  const move = e => {
    const b = st.getBoundingClientRect(), rad = b.width / 2;
    let dx = e.clientX - (b.left + rad), dy = e.clientY - (b.top + rad);
    const d = Math.hypot(dx, dy), max = rad * 0.6;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    set(dx < -rad * 0.2, dx > rad * 0.2, dy < -rad * 0.3);
  };
  const end = () => { knob.style.transform = ''; set(false, false, false); };
  st.addEventListener('pointerdown', e => { e.preventDefault(); st.setPointerCapture(e.pointerId); move(e); });
  st.addEventListener('pointermove', e => { if (st.hasPointerCapture(e.pointerId)) move(e); });
  ['pointerup', 'pointercancel'].forEach(t => st.addEventListener(t, end));
});
document.querySelectorAll('button[data-f]').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); shoot(players[+b.dataset.f]); });
});
cv.addEventListener('pointerdown', () => { if (state !== 'play') init(); });

init();
loop();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
